[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-netdevops-validator"
version = "0.1.0"
description = "Python-based validator for automated OSPF resilience checks in a tactical IP network lab."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Juan Carlos Albert Fillol" }]
dependencies = [
    "netmiko>=4.3.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tactical-validator = "tactical_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
